<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - نظام المبيعات</title>
    <!-- استدعاء Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- استدعاء مكتبة Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 h-screen flex items-center justify-center">

    <div class="bg-white p-8 rounded-xl shadow-lg w-96 border-t-4 border-blue-600">
        <h2 class="text-2xl font-bold text-center mb-6 text-gray-800">تسجيل الدخول للمنظومة</h2>

        <form id="loginForm" class="space-y-5">
            <div>
                <label class="block text-gray-700 text-sm font-bold mb-2">البريد الإلكتروني</label>
                <input type="email" id="email" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="admin@shoes.com" required>
            </div>

            <div>
                <label class="block text-gray-700 text-sm font-bold mb-2">كلمة المرور</label>
                <input type="password" id="password" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="••••••••" required>
            </div>

            <button type="submit" class="w-full bg-blue-600 text-white font-bold py-2 px-4 rounded-lg hover:bg-blue-700 transition duration-200">
                تسجيل الدخول
            </button>
        </form>

        <!-- رسالة الخطأ -->
        <p id="error-msg" class="text-red-500 text-sm text-center mt-4 hidden">بيانات الدخول غير صحيحة!</p>
    </div>

    <!-- استدعاء ملف الجافاسكريبت الخاص بك -->
    <script src="app.js"></script>
</body>
</html>
