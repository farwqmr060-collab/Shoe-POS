<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الإدارة - لوحة التحكم</title>
    <!-- ربط ملف الهوية PWA -->
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">

    <nav class="bg-blue-800 text-white p-4 flex justify-between items-center shadow-md">
        <h1 class="text-xl font-bold">لوحة تحكم الإدارة</h1>
        <button onclick="logout()" class="bg-red-500 px-4 py-2 rounded-lg hover:bg-red-600 font-bold transition">تسجيل خروج</button>
    </nav>

    <div class="max-w-6xl mx-auto mt-8 grid grid-cols-1 md:grid-cols-3 gap-6 px-4">

        <div class="md:col-span-1 bg-white p-6 rounded-xl shadow-lg border-t-4 border-blue-800 h-fit">
            <h2 class="text-xl font-bold mb-4 text-gray-800 border-b pb-2">إضافة موديل جديد</h2>
            <form id="addShoeForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-bold mb-1">اسم أو كود الموديل</label>
                    <input type="text" id="shoeName" class="w-full border p-2 rounded focus:ring-2 focus:ring-blue-500" required>
                </div>
                <div>
                    <label class="block text-sm font-bold mb-1">سعر البيع (ج.م)</label>
                    <input type="number" id="shoePrice" class="w-full border p-2 rounded focus:ring-2 focus:ring-blue-500" required>
                </div>
                <div>
                    <label class="block text-sm font-bold mb-1">المقاسات (مفصولة بفاصلة)</label>
                    <input type="text" id="shoeSizes" class="w-full border p-2 rounded focus:ring-2 focus:ring-blue-500" placeholder="41, 42, 43" required>
                </div>
                <button type="submit" class="w-full bg-blue-600 text-white font-bold py-2 rounded hover:bg-blue-700 transition">حفظ في المخزن</button>
            </form>
            <div id="successMsg" class="hidden mt-4 p-2 bg-green-100 text-green-700 text-center rounded font-bold text-sm">تم الحفظ بنجاح!</div>
        </div>

        <div class="md:col-span-2 space-y-6">
            <div class="grid grid-cols-2 gap-4">
                <div class="bg-white p-6 rounded-xl shadow-lg border-r-4 border-green-500 flex items-center justify-between">
                    <div>
                        <p class="text-gray-500 font-bold mb-1">إجمالي المبيعات</p>
                        <p class="text-3xl font-black text-gray-800" id="totalRevenue">0 ج.م</p>
                    </div>
                </div>
                <div class="bg-white p-6 rounded-xl shadow-lg border-r-4 border-blue-500 flex items-center justify-between">
                    <div>
                        <p class="text-gray-500 font-bold mb-1">عدد الفواتير</p>
                        <p class="text-3xl font-black text-gray-800" id="totalInvoices">0</p>
                    </div>
                </div>
            </div>

            <div class="bg-white rounded-xl shadow-lg overflow-hidden">
                <div class="p-4 bg-gray-50 border-b flex justify-between items-center">
                    <h2 class="text-lg font-bold text-gray-800">سجل حركة البيع</h2>
                    <button onclick="fetchDashboardData()" class="text-blue-600 hover:underline text-sm font-bold">تحديث البيانات</button>
                </div>
                <div class="p-0 overflow-x-auto">
                    <table class="w-full text-right">
                        <thead class="bg-gray-100 text-gray-600 text-sm">
                            <tr>
                                <th class="p-4 border-b">رقم الفاتورة</th>
                                <th class="p-4 border-b">الوقت والتاريخ</th>
                                <th class="p-4 border-b">التفاصيل</th>
                                <th class="p-4 border-b">الإجمالي</th>
                            </tr>
                        </thead>
                        <tbody id="invoicesTableBody" class="text-sm">
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const supabaseUrl = 'https://dawjuahmdcsecilazvlx.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRhd2p1YWhtZGNzZWNpbGF6dmx4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA1NDQ1NDgsImV4cCI6MjEwNjEyMDU0OH0.sjZPVvsoQSJGzuqVTNHKgA7aKjf2QbwABQx1UQU0ndA';
        const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

        document.getElementById('addShoeForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const name = document.getElementById('shoeName').value;
        const price = document.getElementById('shoePrice').value;
        const sizesArray = document.getElementById('shoeSizes').value.split(',').map(s => s.trim()).filter(s => s);

        const { data: shoeData, error: shoeError } = await supabase.from('shoes').insert([{ name, price }]).select();
        if (shoeError) return alert('خطأ: ' + shoeError.message);

        const sizesToInsert = sizesArray.map(size => ({ shoe_id: shoeData[0].id, size, stock: 10 }));
        await supabase.from('shoe_sizes').insert(sizesToInsert);

        document.getElementById('successMsg').classList.remove('hidden');
        document.getElementById('addShoeForm').reset();
        setTimeout(() => document.getElementById('successMsg').classList.add('hidden'), 3000);
        });

        async function fetchDashboardData() {
        const tableBody = document.getElementById('invoicesTableBody');
        tableBody.innerHTML = '<tr><td colspan="4" class="p-4 text-center text-gray-500">جاري التحميل...</td></tr>';

        const { data: invoices, error } = await supabase
        .from('invoices')
        .select(`id, total_amount, created_at, invoice_items ( shoe_name, size, price )`)
        .order('created_at', { ascending: false });

        if (error) return alert('خطأ في جلب البيانات');

        let totalRevenue = 0;
        tableBody.innerHTML = '';

        invoices.forEach(inv => {
        totalRevenue += parseFloat(inv.total_amount);

        let itemsDetails = inv.invoice_items.map(item => `<span class="bg-blue-100 text-blue-800 px-2 py-1 rounded text-xs ml-1">${item.shoe_name} (${item.size})</span>`).join('');
        let dateObj = new Date(inv.created_at);

        tableBody.innerHTML += `
        <tr class="hover:bg-gray-50 border-b">
        <td class="p-4 text-gray-500 font-mono">${inv.id.substring(0, 8)}</td>
        <td class="p-4 text-gray-800">${dateObj.toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' })} <br><span class="text-xs text-gray-400">${dateObj.toLocaleDateString('ar-EG')}</span></td>
        <td class="p-4">${itemsDetails}</td>
        <td class="p-4 font-bold text-green-600">${inv.total_amount} ج.م</td>
        </tr>
        `;
        });

        document.getElementById('totalRevenue').innerText = `${totalRevenue} ج.م`;
        document.getElementById('totalInvoices').innerText = invoices.length;
        }

        function logout() { window.location.href = 'index.html'; }

        fetchDashboardData();
    </script>

    <!-- تشغيل وضع الأوفلاين -->
    <script>
        if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW fail: ', err));
        });
        }
    </script>
</body>
</html>
